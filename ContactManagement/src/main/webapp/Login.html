<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Login</title>

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(120deg, #e0f2fe, #f8fafc);
}

/* ===== NAVBAR ===== */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 15px 40px;
    color: white;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-links a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #38bdf8;
}

/* ===== LOGIN CONTAINER ===== */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 85vh;
}

/* ===== LOGIN CARD ===== */
.card {
    background: white;
    padding: 35px;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.card h2 {
    margin-bottom: 20px;
    color: #1e293b;
}

/* ===== INPUT ===== */
.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    font-size: 14px;
    color: #475569;
}

.input-group input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    outline: none;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 5px rgba(37,99,235,0.3);
}

/* ===== BUTTON ===== */
button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
}

/* ===== FOOTER ===== */
.footer-text {
    margin-top: 15px;
    font-size: 14px;
}

.footer-text a {
    color: #2563eb;
    text-decoration: none;
}

.footer-text a:hover {
    text-decoration: underline;
}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->
<div class="navbar">
    <div class="logo">MyCompany</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- ===== LOGIN FORM ===== -->
<div class="container">
    <div class="card">
        <h2>Login</h2>

        <form action="Login" method="POST">

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="user" id="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="pass" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit">Sign In</button>

        </form>

        <div class="footer-text">
            <p>Don't have an account? <a href="#">Register</a></p>
        </div>
    </div>
</div>

</body>
</html>
